<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Racing Clubs</title>
  <style>
    :root{--bg:#0b1016;--panel:#141b24;--panel2:#1a2431;--text:#e6edf3;--muted:#9fb0c3;--line:#2c3a4d;--accent:#5cc8ff;--ok:#78e08f;--danger:#ff6b6b}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#0b1016,#0d1117);color:var(--text)}
    .app{display:grid;grid-template-columns:260px 1fr 320px;min-height:100vh}
    .left,.right,.center{border-right:1px solid var(--line)} .right{border-right:none}
    .left{background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
    .center{background:var(--panel2);display:flex;flex-direction:column}
    .right{background:var(--panel);padding:12px;overflow:auto}
    .topbar{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
    .btn,input{border:1px solid var(--line);background:#0e151f;color:var(--text);border-radius:8px;padding:8px}
    .btn{cursor:pointer}.btn:hover{border-color:var(--accent)} .btn.primary{background:#123042}
    .btn.ok{background:#183524}.btn.danger{background:#3b1d23}
    .small{font-size:12px;color:var(--muted)}
    .club-item{width:100%;text-align:left;margin:4px 0}
    .chat-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;flex:1;min-height:0}
    .chat-col{display:flex;flex-direction:column;min-height:0}
    .log{flex:1;min-height:220px;overflow:auto;background:#0b121b;border:1px solid var(--line);border-radius:10px;padding:10px}
    .msg{padding:6px;border-bottom:1px dashed #243244}
    .controls{display:flex;gap:8px;margin-top:8px}
    .members{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#0f1824;border:1px solid var(--line);padding:4px 8px;border-radius:999px;font-size:12px}
    .stack{display:flex;flex-direction:column;gap:8px}
    @media (max-width:1100px){.app{grid-template-columns:1fr}.left,.right{border-right:none;border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
<div class="app">
  <aside class="left">
    <a class="btn" href="index.html">← Back to game</a>
    <div class="stack">
      <div><b>Identity</b></div>
      <input id="playerName" maxlength="24" placeholder="Account username" disabled>
      <button class="btn" id="saveName" disabled>Locked</button>
      <div class="small">Chat username is locked to your signed-in account.</div>
    </div>
    <hr style="border-color:var(--line);width:100%">
    <div><b>Club Browser</b></div>
    <div class="controls"><button class="btn" id="refreshClubsBtn">Refresh</button><button class="btn" id="newClubFocusBtn">+ New</button></div>
    <div id="club-list"></div>
  </aside>

  <main class="center">
    <div class="topbar">
      <b id="club-title">No club selected</b>
      <span class="small" id="club-meta"></span><span class="small" id="ui-status"></span>
      <button class="btn" id="jumpNormalBtn"># Club chat</button>
      <button class="btn" id="jumpAnnBtn">📣 Announcements</button>
    </div>
    <div style="padding:10px;border-bottom:1px solid var(--line)">
      <input id="newClubName" placeholder="Create a unique club name"> <button class="btn primary" id="createClubBtn">Create club</button>
    </div>
    <div class="chat-wrap">
      <section class="chat-col">
        <h3 id="normalHeader"># Club Chat</h3>
        <div id="chat-log" class="log"></div>
        <div class="controls"><input id="clubMessageInput" placeholder="Message club" style="flex:1"><button class="btn ok" id="sendClubMsgBtn">Send</button></div>
      </section>
      <section class="chat-col">
        <h3 id="annHeader">📣 Announcements</h3>
        <div id="ann-log" class="log"></div>
        <div class="controls"><input id="annMessageInput" placeholder="Owner announcement" style="flex:1"><button class="btn primary" id="sendAnnBtn">Announce</button></div>
      </section>
    </div>
  </main>

  <aside class="right">
    <h3>Members</h3>
    <div id="member-list" class="members"></div>
    <p class="small">Owner controls are hidden if you are not the owner.</p>
    <div id="owner-tools" style="display:none" class="stack">
      <h4>Owner controls</h4>
      <div class="controls"><input id="addMemberInput" placeholder="Add member"><button class="btn ok" id="addMemberBtn">Add</button></div>
      <div class="controls"><input id="kickMemberInput" placeholder="Kick member"><button class="btn danger" id="kickMemberBtn">Kick</button></div>
      <div class="controls"><input id="muteMemberInput" placeholder="Mute member"><button class="btn" id="muteMemberBtn">Mute</button></div>
      <div class="controls"><input id="renameClubInput" placeholder="Rename club"><button class="btn" id="renameClubBtn">Rename</button></div>
      <div class="controls"><input id="transferOwnerInput" placeholder="Transfer owner"><button class="btn" id="transferOwnerBtn">Transfer</button></div>
      <button class="btn danger" id="deleteClubBtn">Delete club</button>
    </div>
  </aside>
</div>
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script>
const CLUBS_API_BASE='https://racing-clubs-api.ga1010.workers.dev';
const PLAYER_NAME_KEY='racing-player-name-v1';
const ably = new Ably.Realtime('kbFfcw.zJJN7Q:gkQ0QImXKGlMS_rgQxn2DGUHssQd0zRefhfgDjFwDmM');
const channel = ably.channels.get('global-chat');
function getAccountUsername(){ try{ const raw=localStorage.getItem('racing-account-session-v1'); const parsed=raw?JSON.parse(raw):null; return String(parsed?.username||'').trim(); } catch { return ''; } }
let me=getAccountUsername();
let currentClub=null;
let liveNormalFallback=[];
const $=id=>document.getElementById(id);
$('playerName').value=me||'Not signed in';

function parseClubTaggedMessage(text){const v=String(text||'');const o=v.match(/^\[([^\]]+)\]\[owner\]\s+([^:]+):\s([\s\S]*)$/);if(o)return{clubId:o[1],stream:'owner'};const n=v.match(/^\[([^\]]+)\]\s+([^:]+):\s([\s\S]*)$/);if(n)return{clubId:n[1],stream:'normal'};return null;}
async function api(path,options={}){const res=await fetch(CLUBS_API_BASE+path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const json=await res.json();if(!res.ok) throw new Error(json.error||'Request failed');return json;}
function toast(msg,isErr=false){const el=$('ui-status'); if(!el) return; el.textContent=String(msg||''); el.style.color=isErr?'#ff8b8b':'#9fb0c3'; setTimeout(()=>{ if(el.textContent===String(msg||'')) el.textContent=''; },3500);}
function renderMembers(list){$('member-list').innerHTML='';(list||[]).forEach(m=>{const s=document.createElement('span');s.className='tag';s.textContent=m;$('member-list').appendChild(s);});}
function renderLog(id,items){const el=$(id);el.innerHTML='';(items||[]).forEach(m=>{const d=document.createElement('div');d.className='msg';d.textContent=`${m.username}: ${m.content}`;el.appendChild(d);});el.scrollTop=el.scrollHeight;}


function resolveClubIdentity(){
  const accountName = getAccountUsername();
  if(!currentClub) return accountName;
  const found = (currentClub.members||[]).find(m=>String(m).trim().toLowerCase()===String(accountName).trim().toLowerCase());
  return found || accountName;
}

async function renderClubs(){const data=await api('/clubs');$('club-list').innerHTML='';(data.clubs||[]).forEach(c=>{const b=document.createElement('button');b.className='btn club-item';b.textContent=`${c.displayName} (${c.members.length})`;b.onclick=()=>openClub(c.clubId);$('club-list').appendChild(b);});}
async function openClub(clubId){const {club}=await api(`/clubs/${clubId}`);currentClub=club;liveNormalFallback=[];const isOwner=club.ownerUsername.toLowerCase()===me.toLowerCase();$('club-title').textContent=club.displayName;$('club-meta').textContent=`owner: ${club.ownerUsername} · id: ${club.clubId}`;$('owner-tools').style.display=isOwner?'block':'none';$('annMessageInput').disabled=!isOwner;$('sendAnnBtn').disabled=!isOwner;renderMembers(club.members);await renderHistory();}
async function renderHistory(){if(!currentClub)return;const h=await api(`/clubs/${currentClub.clubId}/messages`);renderLog('chat-log',(h.normal||[]).slice(-30));renderLog('ann-log',h.owner);} 
async function ownerAction(path,body){if(!currentClub) return; me=getAccountUsername(); if(!me) throw new Error('Log in first.'); try { await api(`/clubs/${currentClub.clubId}/${path}`,{method:'POST',headers:{'x-actor-username':me},body:JSON.stringify(body)}); await openClub(currentClub.clubId); } catch (err) { toast(err?.message||'Owner action failed', true); throw err; }}
async function sendClub(stream,inputId){if(!currentClub)return; const actor=resolveClubIdentity(); if(!actor){ alert('Log in to your account to chat.'); return; } const actorKey=String(actor).trim().toLowerCase(); const isMember=(currentClub.members||[]).some(m=>String(m).trim().toLowerCase()===actorKey); if(!isMember){ toast('Only club members can post in club chat.', true); return; } const content=$(inputId).value.trim(); if(!content)return; try { await api(`/clubs/${currentClub.clubId}/messages`,{method:'POST',headers:{'x-actor-username':actor},body:JSON.stringify({stream,username:actor,content})}); } catch (err) { toast(err?.message||(stream==='owner'?'Failed to send announcement':'Failed to send message'), true); throw err; } $(inputId).value=''; await renderHistory(); }

$('saveName').onclick=()=>{};
$('refreshClubsBtn').onclick=()=>renderClubs();
$('newClubFocusBtn').onclick=()=>$('newClubName').focus();
$('createClubBtn').onclick=async()=>{me=getAccountUsername(); if(!me){ alert('Log in to your account to create clubs.'); return; } const name=$('newClubName').value.trim();if(!name)return; try { await api('/clubs',{method:'POST',body:JSON.stringify({displayName:name,ownerUsername:me})}); $('newClubName').value=''; await renderClubs(); toast('Club created'); } catch (err) { toast(err?.message||'Create failed', true); }};
$('addMemberBtn').onclick=()=>ownerAction('members',{username:$('addMemberInput').value.trim()});
$('kickMemberBtn').onclick=()=>ownerAction('kick',{username:$('kickMemberInput').value.trim()});
$('muteMemberBtn').onclick=()=>ownerAction('mute',{username:$('muteMemberInput').value.trim()});
$('renameClubBtn').onclick=()=>ownerAction('rename',{displayName:$('renameClubInput').value.trim()});
$('transferOwnerBtn').onclick=()=>ownerAction('transfer',{username:$('transferOwnerInput').value.trim()});
$('deleteClubBtn').onclick=async()=>{if(!currentClub)return;await api(`/clubs/${currentClub.clubId}`,{method:'DELETE',headers:{'x-actor-username':me}});currentClub=null;$('club-title').textContent='No club selected';$('club-meta').textContent='';$('chat-log').innerHTML='';$('ann-log').innerHTML='';$('member-list').innerHTML='';$('owner-tools').style.display='none';await renderClubs();};
$('sendClubMsgBtn').onclick=()=>sendClub('normal','clubMessageInput');
$('sendAnnBtn').onclick=()=>sendClub('owner','annMessageInput');
$('jumpNormalBtn').onclick=()=>$('normalHeader').scrollIntoView({behavior:'smooth'});
$('jumpAnnBtn').onclick=()=>$('annHeader').scrollIntoView({behavior:'smooth'});
renderClubs();
</script>
</body>
</html>
