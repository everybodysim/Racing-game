<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skid Circuit — Mobile Emulator</title>
<!--
	SINGLE-FILE MOBILE EMULATOR — just an iframe in a phone-shaped frame.
	Open this file directly in a browser (double-click works, no server needed
	for the chrome itself; the game inside needs its usual hosting).

	Features:
	- Phone screen presets (iPhone / Pixel / Galaxy / iPad sizes)
	- Portrait / landscape rotate
	- Zoom-to-fit so big devices fit your monitor
	- Auto-appends ?is-mobile so the mobile UI activates in the game
	- URL box to point it at a hosted build (localhost or production)

	Zero dependencies, zero network calls (except loading the game itself).
-->
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	body {
		margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
		gap: 14px; padding: 18px 14px 30px;
		font: 600 13px/1.4 system-ui, sans-serif;
		background: radial-gradient(circle at 20% 10%, #16233a 0%, #0b111c 55%, #070b12 100%);
		color: #dcecff;
	}
	h1 { margin: 0; font: 800 17px/1.2 system-ui, sans-serif; letter-spacing: 0.3px; }
	h1 small { display: block; margin-top: 3px; font: 600 11px/1.3 system-ui, sans-serif; color: #7f9bc4; }
	#controls {
		display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
		width: 100%; max-width: 900px; padding: 10px 12px; border-radius: 14px;
		background: rgba(13, 21, 36, 0.85); border: 1px solid rgba(120, 170, 230, 0.25);
	}
	#controls label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9db8dc; }
	select, button, input[type="text"] {
		font: 700 12px/1 system-ui, sans-serif; color: #eaf4ff;
		background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(150, 190, 240, 0.3);
		border-radius: 9px; padding: 8px 10px; outline: none;
	}
	select:hover, button:hover { background: rgba(120, 180, 255, 0.18); }
	button { cursor: pointer; }
	button.active { background: rgba(60, 150, 255, 0.35); border-color: rgba(130, 200, 255, 0.6); }
	#url { flex: 1 1 260px; min-width: 220px; }
	#stage { position: relative; }
	/* The "phone": a bezel around the iframe */
	#phone {
		position: relative; padding: 12px; border-radius: 44px;
		background: linear-gradient(160deg, #3a4657, #171d27 40%, #232b38 60%, #0d1117);
		box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.18);
		transform-origin: top center;
	}
	#notch {
		position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
		width: 96px; height: 22px; border-radius: 0 0 14px 14px;
		background: #0a0e14; z-index: 2; display: none;
	}
	#screen { position: relative; width: 393px; height: 852px; border-radius: 32px; overflow: hidden; background: #000; }
	iframe { width: 100%; height: 100%; border: 0; display: block; }
	#meta { font-size: 11px; color: #7f9bc4; text-align: center; max-width: 640px; }
	#meta code { color: #a9c8f2; background: rgba(255, 255, 255, 0.07); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
	<h1>Skid Circuit — Mobile Emulator<small>An iframe in a phone frame. ?is-mobile is appended automatically.</small></h1>

	<div id="controls">
		<label>Device
			<select id="device">
				<option value="393x852" selected>iPhone 15 Pro (393×852)</option>
				<option value="375x812">iPhone 13/14 (375×812)</option>
				<option value="375x667">iPhone SE (375×667)</option>
				<option value="412x915">Pixel 8 (412×915)</option>
				<option value="360x780">Galaxy S23 (360×780)</option>
				<option value="414x896">iPhone 11 / XR (414×896)</option>
				<option value="744x1133">iPad Mini (744×1133)</option>
				<option value="390x844">iPhone 14/15 (390×844)</option>
			</select>
		</label>
		<button id="rotate" title="Swap width/height">⟳ Rotate</button>
		<label>Zoom
			<select id="zoom">
				<option value="1" selected>100%</option>
				<option value="0.75">75%</option>
				<option value="0.6">60%</option>
				<option value="0.5">50%</option>
			</select>
		</label>
		<label><input type="checkbox" id="append-param" checked> ?is-mobile</label>
		<input type="text" id="url" placeholder="Game URL (index.html path or full http URL)" value="index.html?play=1">
		<button id="reload">↻ Reload</button>
	</div>

	<div id="stage">
		<div id="phone">
			<div id="notch"></div>
			<div id="screen"><iframe id="frame" title="Skid Circuit mobile preview"></iframe></div>
		</div>
	</div>

	<p id="meta">
		Enter a URL above and hit Reload — <code>?is-mobile</code> is appended when the checkbox is on.
		For touch input testing use your browser devtools device mode on top of this, or a real phone.
	</p>

<script>
( function() {
	var DEVICES_WITH_NOTCH = [ '393x852', '375x812', '390x844', '414x896', '412x915' ];
	var $ = function( id ) { return document.getElementById( id ); };
	var frame = $( 'frame' ), screen = $( 'screen' ), phone = $( 'phone' ), notch = $( 'notch' );
	var rotated = false;

	function currentUrl() {
		var raw = $( 'url' ).value.trim();
		if ( ! raw ) return 'about:blank';
		var base = raw;
		if ( ! /^https?:/i.test( raw ) ) {
			// Relative path — resolve against this file's location.
			base = new URL( raw, location.href ).href;
		}
		try {
			var u = new URL( base );
			if ( $( 'append-param' ).checked ) u.searchParams.set( 'is-mobile', '1' );
			else u.searchParams.delete( 'is-mobile' );
			return u.href;
		} catch ( e ) { return base; }
	}

	function apply() {
		var pair = $( 'device' ).value.split( 'x' );
		var w = parseInt( pair[ 0 ], 10 ), h = parseInt( pair[ 1 ], 10 );
		if ( rotated ) { var t = w; w = h; h = t; }
		screen.style.width = w + 'px';
		screen.style.height = h + 'px';
		notch.style.display = ( ! rotated && DEVICES_WITH_NOTCH.indexOf( $( 'device' ).value ) !== -1 ) ? 'block' : 'none';
		phone.style.transform = 'scale(' + ( parseFloat( $( 'zoom' ).value ) || 1 ) + ')';
	}

	$( 'device' ).addEventListener( 'change', function() { rotated = false; apply(); } );
	$( 'rotate' ).addEventListener( 'click', function() { rotated = ! rotated; apply(); } );
	$( 'zoom' ).addEventListener( 'change', apply );
	$( 'reload' ).addEventListener( 'click', function() { frame.src = currentUrl(); } );
	$( 'url' ).addEventListener( 'keydown', function( e ) { if ( e.key === 'Enter' ) frame.src = currentUrl(); } );
	$( 'append-param' ).addEventListener( 'change', function() { frame.src = currentUrl(); } );

	apply();
	frame.src = currentUrl();
} )();
</script>
</body>
</html>
