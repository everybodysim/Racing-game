    :root { color-scheme: dark; }

<script type="module">
	// Realistic 3D top-down track preview. The module exposes
	// window.__renderTrackTopDown; the page falls back to its flat 2D
	// preview if the module or WebGL is unavailable.
	import { renderTrackTopDown } from './js/TrackTopDownRenderer.js?v=20260923';
	import { encodeCellsV3 } from './js/Track.js?v=1000238';
	import { generateTrackPlan } from './js/CupTrackGen.js?v=20260918';
	window.__renderTrackTopDown = renderTrackTopDown;
	window.__encodeCellsV3 = encodeCellsV3;
	window.__cupTrackGen = generateTrackPlan;
</script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<main id="main-content">
  <h2>🏁 Track of the Day</h2>
  <p class="subtitle">Daily seeded challenge track with leaderboard lookup for today's fastest run.</p>
  <div class="row">
    <label>UTC Date: <input id="dateInput" type="date"></label>
  </div>
  <div class="row">
    <button id="genBtn">Generate</button>
    <button id="copyBtn">Copy URL</button>
    <button id="openBtn">Open URL</button>
  </div>

  <div class="card record-card">
    <div><strong>Current record holder</strong></div>
    <div class="record-main" id="totd-record-holder">Loading…</div>
    <div class="record-time" id="totd-record-time">--.--s</div>
  </div>

  <div class="card">
    <strong>Preview</strong><br>
    <canvas id="preview" width="640" height="440"></canvas>
  </div>

  <details class="card">
    <summary style="cursor:pointer;font-weight:700">Advanced — track data & URLs</summary>
    <div style="margin-top:10px">
      <div><strong>Base URL:</strong> <code id="baseOut"></code></div>
      <div><strong>Seed:</strong> <span id="seedOut"></span></div>
      <div><strong>Map:</strong><textarea id="mapOut" readonly></textarea></div>
      <div><strong>Mods (bumps + surfaces + scenery):</strong><textarea id="modsOut" readonly></textarea></div>
      <div><strong>Play URL:</strong><textarea id="urlOut" readonly></textarea></div>
      <div style="margin-top:10px"><strong>Cells JSON</strong></div>
      <textarea id="cellsOut" readonly style="min-height:130px"></textarea>
    </div>
  </details>

<script>
(() => {
  const BASE_URL = "https://everybodysim.github.io/Racing-game/index.html";
  const LEADERBOARD_API_BASE = 'https://racing-leaderboard-api.ga1010.workers.dev/api/leaderboard';

  // ---------- codec ----------
  function encodeMods(modsObj) {
    const json = JSON.stringify(modsObj);
    return btoa(unescape(encodeURIComponent(json)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function normalizeTrackPath(pathValue) {
    const raw = String(pathValue || '/');
    if (raw === '/index.html') return '/';
    if (raw.endsWith('/index.html')) return `${raw.slice(0, -11)}/`;
    return raw;
  }

  function fnv64Hex(value, start, prime) {
    let hash = start;
    for (let i = 0; i < value.length; i++) {
      hash ^= BigInt(value.charCodeAt(i));
      hash = (hash * prime) & 0xffffffffffffffffn;
    }
    return hash.toString(16).padStart(16, '0');
  }

  function hashTrackSeed(value) {
    const hashA = fnv64Hex(value, 0xcbf29ce484222325n, 0x100000001b3n);
    const hashB = fnv64Hex(value, 0x84222325cbf29cen, 0x100000001c3n);
    return `${hashA}${hashB}`;
  }

  function buildTrackId(pathname, mapParam, modsParam) {
    const query = new URLSearchParams();
    if (mapParam) query.set('map', mapParam);
    if (modsParam) query.set('mods', modsParam);
    const rawUrl = `${pathname}${query.toString() ? `?${query.toString()}` : ''}`;
    // Default track (no map/mods) keeps the reset v5 id; others keep v4.
    const seedVersion = (mapParam || modsParam) ? 'v4' : 'v5';
    return `trk-${hashTrackSeed(`${seedVersion}-url|${rawUrl}`)}`;
  }

  function getTrackIds(playUrl) {
    try {
      const parsed = new URL(playUrl, window.location.href);
      const map = parsed.searchParams.get('map');
      const mods = parsed.searchParams.get('mods');
      const normalizedPath = normalizeTrackPath(parsed.pathname || '/');
      return [buildTrackId(normalizedPath, map, mods)];
    } catch {
      return [];
    }
  }

  async function fetchTopRow(playUrl) {
    const ids = getTrackIds(playUrl);
    const payloads = await Promise.all(ids.map(async (id) => {
      try {
        const res = await fetch(`${LEADERBOARD_API_BASE}?trackId=${encodeURIComponent(id)}`);
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }));
    const rows = payloads.flatMap((payload) => Array.isArray(payload?.entries) ? payload.entries : []);
    if (!rows.length) return null;
    return rows.slice().sort((a, b) => Number(a?.timeSeconds) - Number(b?.timeSeconds))[0] || null;
  }

  // ---------- deterministic random ----------
  function hash32(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let t = seed >>> 0;
    return function() {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rndInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

  function utcTodayStr() {
    const d = new Date();
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // ---------- loop generation ----------
  function sampleDeterministic(arr, rng, count) {
    const copy = arr.slice();
    const out = [];
    for (let i = 0; i < count && copy.length; i++) {
      const idx = Math.floor(rng() * copy.length);
      out.push(copy[idx]);
      copy.splice(idx, 1);
    }
    return out;
  }

  function generateForDate(utcDate) {
    const seedText = `daily-v2:${utcDate}`;
    if (!window.__cupTrackGen) throw new Error('Track generator module failed to load');
    // Loop, checkpoints, bumps, surfaces and elevated detours come from the
    // shared js/CupTrackGen.js — the same fixed generator weekly-cup.html
    // uses. Detours can cross OVER the ground loop through elevated-cross /
    // elevated-cross-corner blocks, and ramps attach in-line (no 3-way/4-way).
    const plan = window.__cupTrackGen(seedText);
    const tiles = plan.cells;

    // Daily scenery flavor stays page-side, on its own deterministic rng
    // stream so the shared plan and the scenery never step on each other.
    const rng = mulberry32(hash32(seedText) ^ 0x9e3779b9);
    const roadCells = tiles.map((t) => [t[0], t[1]]);
    const poolSet = new Set((plan.modsObj.q || []).map(([x, z]) => `${x},${z}`));
    const notPool = ([x, z]) => !poolSet.has(`${x},${z}`);

    const poleCandidates = [...roadCells, ...roadCells.map(([x, z]) => [x + 1, z]), ...roadCells.map(([x, z]) => [x - 1, z])].filter(notPool);
    const poleCount = Math.min(5, Math.max(1, Math.floor(tiles.length / 16)));
    const poles = sampleDeterministic(poleCandidates, rng, poleCount);

    // scenery around road
    const roadSet = new Set(roadCells.map(([x, z]) => `${x},${z}`));
    const xs = tiles.map((t) => t[0]), zs = tiles.map((t) => t[1]);
    const minX = Math.min(...xs) - 2, maxX = Math.max(...xs) + 2;
    const minZ = Math.min(...zs) - 2, maxZ = Math.max(...zs) + 2;

    const decoCandidates = [];
    for (let z = minZ; z <= maxZ; z++) {
      for (let x = minX; x <= maxX; x++) {
        const k = `${x},${z}`;
        if (roadSet.has(k)) continue;
        if (poolSet.has(k)) continue;

        let nearRoad = false;
        for (let dz = -1; dz <= 1 && !nearRoad; dz++) {
          for (let dx = -1; dx <= 1 && !nearRoad; dx++) {
            if (roadSet.has(`${x + dx},${z + dz}`)) nearRoad = true;
          }
        }
        if (nearRoad) decoCandidates.push([x, z]);
      }
    }

    const decoCount = Math.min(10, Math.max(3, Math.floor(tiles.length / 6)));
    const pickedDeco = sampleDeterministic(decoCandidates, rng, decoCount);
    const decoTypes = ['decoration-forest', 'decoration-tents', 'decoration-empty'];

    const deco = pickedDeco.map(([x, z]) => {
      const type = decoTypes[Math.floor(rng() * decoTypes.length)];
      const orient = [0, 16, 10, 22][Math.floor(rng() * 4)];
      return [x, z, type, orient];
    });

    return {
      seedText,
      cells: tiles,
      mods: {
        b: plan.modsObj.b, // bumps
        p: poles,          // poles
        s: [],             // legacy boost pads (unused)
        u: plan.modsObj.u, // surfaces
        d: deco,           // scenery
        e: plan.modsObj.e, // elevated road: detours + cross-overs
        q: plan.modsObj.q  // water pools in road-enclosed pockets
      }
    };
  }

  function buildUrl(map, mods) {
    const u = new URL(BASE_URL);
    u.searchParams.set('map', map);
    u.searchParams.set('mods', mods);
    return u.toString();
  }

  function drawPreview(cells, mods) {
    const cv = document.getElementById('preview');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);

    const xs = cells.map(c => c[0]), zs = cells.map(c => c[1]);
    const minX = Math.min(...xs) - 2, maxX = Math.max(...xs) + 2;
    const minZ = Math.min(...zs) - 2, maxZ = Math.max(...zs) + 2;
    const gw = maxX - minX + 1, gh = maxZ - minZ + 1;
    const pad = 18;
    const size = Math.floor(Math.min((cv.width - pad * 2) / gw, (cv.height - pad * 2) / gh));

    const toPix = (x, z) => [pad + (x - minX) * size, pad + (z - minZ) * size];

    // grid
    ctx.strokeStyle = '#1f2532';
    for (let x = 0; x <= gw; x++) {
      const px = pad + x * size;
      ctx.beginPath(); ctx.moveTo(px, pad); ctx.lineTo(px, pad + gh * size); ctx.stroke();
    }
    for (let z = 0; z <= gh; z++) {
      const py = pad + z * size;
      ctx.beginPath(); ctx.moveTo(pad, py); ctx.lineTo(pad + gw * size, py); ctx.stroke();
    }

    const color = {
      'track-straight': '#4da3ff',
      'track-corner': '#b084ff',
      'track-checkpoint': '#ffd54f',
      'track-finish': '#72e39a',
    };

    for (const [x, z, t] of cells) {
      const [px, py] = toPix(x, z);
      ctx.fillStyle = color[t] || '#777';
      ctx.fillRect(px + 2, py + 2, size - 4, size - 4);
    }

    // surface markers
    for (const [x, z, surfaceType] of (mods.u || [])) {
      const [px, py] = toPix(x, z);
      ctx.fillStyle =
        surfaceType === 'surface-ice' ? '#7ad8ff' :
        surfaceType === 'surface-boost' ? '#ff9f2e' :
        '#b88657';
      ctx.fillRect(px + size * 0.12, py + size * 0.12, size * 0.76, size * 0.76);
    }

    // scenery markers
    for (const [x, z, type] of (mods.d || [])) {
      const [px, py] = toPix(x, z);
      ctx.fillStyle =
        type === 'decoration-forest' ? '#2ecc71' :
        type === 'decoration-tents'  ? '#f39c12' :
        '#95a5a6';
      ctx.fillRect(px + size * 0.25, py + size * 0.25, size * 0.5, size * 0.5);
    }

    // bumps as red rings
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 2;
    for (const [x, z] of (mods.b || [])) {
      const [px, py] = toPix(x, z);
      ctx.beginPath();
      ctx.arc(px + size / 2, py + size / 2, Math.max(5, size * 0.26), 0, Math.PI * 2);
      ctx.stroke();
    }

    // poles as orange dots
    ctx.fillStyle = '#f08c3a';
    for (const [x, z] of (mods.p || [])) {
      const [px, py] = toPix(x, z);
      ctx.beginPath();
      ctx.arc(px + size / 2, py + size / 2, Math.max(2, size * 0.12), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ── Realistic 3D top-down preview ──
  // Renders ONE frozen bird's-eye snapshot of the TOTD track with the real
  // block models (js/TrackTopDownRenderer.js, loaded via the importmap
  // module in <head>). The flat grid stays underneath as the fallback.
  function paintPreviewImageOnCanvas( canvas, dataUrl ) {
    return new Promise( ( resolve ) => {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext( '2d' );
        ctx.clearRect( 0, 0, canvas.width, canvas.height );
        ctx.drawImage( img, 0, 0, canvas.width, canvas.height );
        resolve( true );
      };
      img.onerror = () => resolve( false );
      img.src = dataUrl;
    } );
  }

  async function waitForPreview3dModule( timeoutMs = 8000 ) {
    const start = Date.now();
    while ( ! window.__renderTrackTopDown && Date.now() - start < timeoutMs ) {
      await new Promise( ( r ) => setTimeout( r, 50 ) );
    }
    return !! window.__renderTrackTopDown;
  }

  async function upgradePreview3D( cells, mods, cacheKey ) {
    try {
      if ( ! Array.isArray( cells ) || ! cells.length || ! cacheKey ) return;
      await waitForPreview3dModule();
      if ( ! window.__renderTrackTopDown ) return;
      const cv = document.getElementById( 'preview' );
      if ( ! cv ) return;
      const dataUrl = await window.__renderTrackTopDown( cells, mods, { cacheKey: cacheKey, width: 640, height: 440 } );
      if ( dataUrl ) await paintPreviewImageOnCanvas( cv, dataUrl );
    } catch ( e ) {}
  }

  async function run() {
    const t0 = Date.now();
    while ((!window.__cupTrackGen || !window.__encodeCellsV3) && Date.now() - t0 < 6000) {
      await new Promise((r) => setTimeout(r, 25));
    }
    const date = document.getElementById('dateInput').value || utcTodayStr();
    const generated = generateForDate(date);
    const map = await window.__encodeCellsV3(generated.cells);
    const mods = encodeMods(generated.mods);
    const url = buildUrl(map, mods);

    document.getElementById('baseOut').textContent = BASE_URL;
    document.getElementById('seedOut').textContent = generated.seedText;
    document.getElementById('mapOut').value = map;
    document.getElementById('modsOut').value = mods;
    document.getElementById('urlOut').value = url;
    document.getElementById('cellsOut').value = JSON.stringify(generated.cells, null, 2);

    drawPreview(generated.cells, generated.mods);
    upgradePreview3D( generated.cells, generated.mods, url );

    const holderEl = document.getElementById('totd-record-holder');
    const timeEl = document.getElementById('totd-record-time');
    if (holderEl) holderEl.textContent = 'Loading…';
    if (timeEl) timeEl.textContent = '--.--s';
    const topRow = await fetchTopRow(url);
    if (!topRow) {
      if (holderEl) holderEl.textContent = 'No record yet';
      return;
    }
    if (holderEl) holderEl.textContent = String(topRow.name || 'Unknown');
    if (timeEl) timeEl.textContent = Number.isFinite(Number(topRow.timeSeconds)) ? `${Number(topRow.timeSeconds).toFixed(2)}s` : '--.--s';
  }

  document.getElementById('dateInput').value = utcTodayStr();
  document.getElementById('genBtn').addEventListener('click', () => { run(); });
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const txt = document.getElementById('urlOut').value;
    try { await navigator.clipboard.writeText(txt); alert('URL copied'); }
    catch { alert('Copy failed; copy manually.'); }
  });
  document.getElementById('openBtn').addEventListener('click', () => {
    const url = document.getElementById('urlOut').value;
    if (url) window.open(url, '_blank');
  });

  run();
})();
</script>
</main>

<script type="module" src="js/PageMusic.js"></script>
