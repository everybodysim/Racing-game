<script>
		// ─── White-screen watchdog ───────────────────────────────────
		// If the editor module dies before the render loop starts (a storage
		// quota error, corrupt saved data, a failed import…), the page used to
		// sit blank forever. This captures the error and offers a recovery
		// path instead. The module clears it with window.__editorReady.
		( function () {

			var errors = [];
			function record( text ) {

				errors.push( String( text ).slice( 0, 400 ) );
				if ( errors.length > 8 ) errors.shift();

			}

			window.addEventListener( 'error', function ( e ) {

				record( ( e.message || 'Script error' ) + ( e.filename ? ' @ line ' + e.lineno : '' ) );

			} );
			window.addEventListener( 'unhandledrejection', function ( e ) {

				record( 'Unhandled rejection: ' + ( ( e.reason && ( e.reason.stack || e.reason.message || e.reason ) ) || 'unknown' ) );

			} );

			setTimeout( function () {

				if ( window.__editorReady || document.getElementById( 'editor-boot-overlay' ) ) return;
				var el = document.createElement( 'div' );
				el.id = 'editor-boot-overlay';
				el.setAttribute( 'style', 'position:fixed;inset:0;z-index:99999;background:#10151f;color:#e8f0ff;font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;' );
				el.innerHTML = '<div style="max-width:600px;width:100%">'
					+ '<h2 style="margin:0 0 8px;font:700 19px sans-serif;color:#fff">The editor failed to start</h2>'
					+ '<p style="margin:0 0 12px;color:#9fb2cc">The page kept your saved track. Most startup failures come from full browser storage or a broken cached file — reload first, and reset only if it keeps failing.</p>'
					+ '<pre style="white-space:pre-wrap;word-break:break-word;background:#0a0e16;border:1px solid #2a3547;border-radius:8px;padding:10px;max-height:170px;overflow:auto;font-size:11px;margin:0 0 14px;color:#c9dcf5"></pre>'
					+ '<button id="editor-boot-reload" style="padding:10px 16px;margin-right:8px;border:0;border-radius:8px;background:#3478f6;color:#fff;font:700 13px sans-serif;cursor:pointer">Reload editor</button>'
					+ '<button id="editor-boot-reset" style="padding:10px 16px;border:1px solid #3a4a63;border-radius:8px;background:transparent;color:#cfe0ff;font:700 13px sans-serif;cursor:pointer">Reset editor data</button>'
					+ '</div>';
				el.querySelector( 'pre' ).textContent = errors.length ? errors.join( '\n' ) : 'No JavaScript error was captured — this is likely a storage-full or graphics issue. Try the Reload button.';
				( document.body || document.documentElement ).appendChild( el );
				document.getElementById( 'editor-boot-reload' ).onclick = function () { location.reload(); };
				document.getElementById( 'editor-boot-reset' ).onclick = function () {

					try {

						Object.keys( localStorage ).forEach( function ( key ) {

							if ( key.indexOf( 'racing-editor-' ) === 0 ) localStorage.removeItem( key );

						} );

					} catch ( e ) {}
					location.href = location.pathname;

				};

			}, 7000 );

		} )();
	</script>
