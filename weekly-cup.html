<script>
(() => {
  const BASE_URL = 'https://everybodysim.github.io/Racing-game/index.html';
  const LEADERBOARD_API_BASE = 'https://racing-leaderboard-api.ga1010.workers.dev/api/leaderboard';

  const TYPE_INDEX = { 'track-straight': 0, 'track-corner': 1, 'track-checkpoint': 2, 'track-finish': 3 };
  const GODOT_TO_ORIENT = { 0: 0, 16: 1, 10: 2, 22: 3 };
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

  function hash32(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let t = seed >>> 0;
    return function() {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rndInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
  const key = (x, z) => `${x},${z}`;

  function encodeMods(modsObj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(modsObj))))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function sampleDeterministic(arr, rng, count) {
    const copy = arr.slice();
    const out = [];
    for (let i = 0; i < count && copy.length; i++) {
      const idx = Math.floor(rng() * copy.length);
      out.push(copy[idx]);
      copy.splice(idx, 1);
    }
    return out;
  }

  function genClosedLoop(rng, opts = {}) {
    const W = opts.W ?? 14;
    const H = opts.H ?? 14;
    const minLen = opts.minLen ?? 18;
    const maxLen = opts.maxLen ?? 44;
    for (let attempt = 0; attempt < (opts.attempts ?? 240); attempt++) {
      const start = [rndInt(rng, 2, W - 3), rndInt(rng, 2, H - 3)];
      const path = [start];
      const seen = new Set([key(start[0], start[1])]);
      let prevDir = -1;
      const target = rndInt(rng, minLen, maxLen);
      for (let step = 0; step < maxLen + 20; step++) {
        const [cx, cz] = path[path.length - 1];
        const [sx, sz] = start;
        if (path.length >= minLen && Math.abs(cx - sx) + Math.abs(cz - sz) === 1) {
          path.push([sx, sz]);
          if (path.length - 1 >= minLen) return path;
        }
        // Never step back onto the start cell mid-walk: closing the loop
        // is handled by the dedicated push above. The old code let the walk
        // re-enter the start (isStart bypassed the visited check), so a loop
        // could contain the same cell twice and two blocks landed on one tile.
        const candidates = [];
        for (let di = 0; di < 4; di++) {
          const [dx, dz] = DIRS[di];
          const nx = cx + dx;
          const nz = cz + dz;
          if (nx < 1 || nz < 1 || nx >= W - 1 || nz >= H - 1) continue;
          if (seen.has(key(nx, nz))) continue;
          if (prevDir !== -1 && (di + 2) % 4 === prevDir) continue;
          let neighbors = 0;
          for (const [adx, adz] of DIRS) {
            if (seen.has(key(nx + adx, nz + adz))) neighbors++;
          }
          if (neighbors > 2) continue;
          let score = 1;
          if (prevDir === di) score += 1.4;
          candidates.push({ di, nx, nz, score });
        }
        if (!candidates.length) break;
        let total = candidates.reduce((s, c) => s + c.score, 0);
        let r = rng() * total;
        let pick = candidates[0];
        for (const c of candidates) {
          r -= c.score;
          if (r <= 0) { pick = c; break; }
        }
        path.push([pick.nx, pick.nz]);
        seen.add(key(pick.nx, pick.nz));
        prevDir = pick.di;
        if (path.length >= target && Math.abs(pick.nx - sx) + Math.abs(pick.nz - sz) === 1) {
          path.push([sx, sz]);
          return path;
        }
      }
    }
    return null;
  }

  function loopToTiles(loop) {
    const unique = loop.slice(0, -1);
    const n = unique.length;
    const dir = (a, b) => {
      const dx = b[0] - a[0], dz = b[1] - a[1];
      if (dx === 1 && dz === 0) return 'E';
      if (dx === -1 && dz === 0) return 'W';
      if (dx === 0 && dz === 1) return 'S';
      if (dx === 0 && dz === -1) return 'N';
      return '?';
    };
    const tiles = [];
    for (let i = 0; i < n; i++) {
      const prev = unique[(i - 1 + n) % n];
      const cur = unique[i];
      const next = unique[(i + 1) % n];
      const set = new Set([dir(cur, prev), dir(cur, next)]);
      let type = 'track-straight';
      let orient = 0;
      if (set.has('N') && set.has('S')) { type = 'track-straight'; orient = 0; }
      else if (set.has('E') && set.has('W')) { type = 'track-straight'; orient = 22; }
      else {
        type = 'track-corner';
        if (set.has('E') && set.has('S')) orient = 16;
        else if (set.has('W') && set.has('S')) orient = 0;
        else if (set.has('N') && set.has('E')) orient = 10;
        else if (set.has('W') && set.has('N')) orient = 22;
      }
      tiles.push([cur[0], cur[1], type, orient]);
    }
    let finishIdx = tiles.findIndex((t) => t[2] === 'track-straight');
    if (finishIdx < 0) finishIdx = 0;
    tiles[finishIdx][2] = 'track-finish';
    const cpCandidates = [];
    for (let i = 0; i < tiles.length; i++) {
      if (i === finishIdx || tiles[i][2] !== 'track-straight') continue;
      const ringDist = Math.min(Math.abs(i - finishIdx), tiles.length - Math.abs(i - finishIdx));
      if (ringDist > Math.floor(tiles.length / 6)) cpCandidates.push(i);
    }
    return { tiles, cpCandidates };
  }

  // ─── Port grammar helpers ───────────────────────────────────────────
  // Side vectors, 90°-per-orient rotation (S→E at orient 16), and port
  // resolution for every road block. Every generated connection is
  // validated against these tables — same conventions as js/Track.js
  // (ORIENT_DEG {0:0,10:180,16:90,22:270}) and the block/port definition.
  const SIDE_VEC = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  const OPP_SIDE = { N: 'S', S: 'N', E: 'W', W: 'E' };
  const ORIENT_Q = { 0: 0, 16: 1, 10: 2, 22: 3 };
  const ROT_CYCLE = ['N', 'W', 'S', 'E']; // one 90° step: N→W→S→E→N

  function rotSide(side, orient) {
    let i = ROT_CYCLE.indexOf(side);
    if (i < 0) return side;
    return ROT_CYCLE[(i + (ORIENT_Q[orient] ?? 0)) % 4];
  }

  function dirFromTo(from, to) {
    for (const side of ['N', 'E', 'S', 'W']) {
      const [dx, dz] = SIDE_VEC[side];
      if (from[0] + dx === to[0] && from[1] + dz === to[1]) return side;
    }
    return null;
  }

  function orientFor(dirs, baseDirs) {
    for (const o of [0, 16, 10, 22]) {
      const rot = baseDirs.map((s) => rotSide(s, o));
      if (rot.length === dirs.length && rot.every((s) => dirs.includes(s))) return o;
    }
    return 0;
  }

  // Default-orientation port tables per block (mirrors the block/port set).
  const BLOCK_PORTS = {
    'track-straight': { ground: ['N', 'S'] },
    'track-corner': { ground: ['S', 'W'] },
    'track-3-way': { ground: ['S', 'E', 'W'] },
    'track-4-way': { ground: ['N', 'E', 'S', 'W'] },
    'track-checkpoint': { ground: ['N', 'S'] },
    'track-finish': { ground: ['N', 'S'] },
    'elevated-straight': { elevated: ['N', 'S'] },
    'elevated-corner': { elevated: ['S', 'W'] },
    'elevated-3-way': { elevated: ['W', 'E', 'S'] },
    'elevated-4-way': { elevated: ['N', 'E', 'S', 'W'] },
    'elevated-checkpoint': { elevated: ['N', 'S'] },
    'elevated-cross': { elevated: ['N', 'S'], ground: ['E', 'W'] },
    'elevated-cross-corner': { elevated: ['S', 'W'], ground: ['N', 'E'] },
    'slope-up': { elevated: ['N'], ground: ['S'] },
  };

  // ─── Elevated detours ───────────────────────────────────────────────
  // Replace a long plain run of the loop (straights/corners between the
  // finish/checkpoints) with slope-up → elevated road → slope-up(descend).
  // The elevated run copies the removed run's connectivity 1:1, so every
  // connection stays port-valid, and support pillars render automatically
  // under each elevated block (js/Track.js createElevatedSupport).
  function genDetours(rng, tiles, specialIdx, removedIdx, elevEntries) {
    const n = tiles.length;
    const isPlain = (i) => !specialIdx.has(i) && (tiles[i][2] === 'track-straight' || tiles[i][2] === 'track-corner');
    if (!tiles.some((_, i) => isPlain(i))) return;
    const runs = [];
    let anchor = 0;
    while (anchor < n && isPlain(anchor)) anchor++;
    if (anchor >= n) {
      runs.push({ start: 0, len: n });
    } else {
      for (let k = 0; k < n; k++) {
        const idx = (anchor + k) % n;
        if (!isPlain(idx) || isPlain((idx + n - 1) % n)) continue;
        let len = 1;
        while (len < n && isPlain((idx + len) % n)) len++;
        if (len < n) runs.push({ start: idx, len });
      }
    }
    // Slopes only connect when the road runs STRAIGHT through their cell
    // (a slope's ground and elevated ports are always opposite), so a
    // detour window [i..j] must start and end on straight tiles. Corners
    // are welcome inside the elevated run, just not under the ramps.
    const windows = [];
    for (const run of runs) {
      if (run.len < 6) continue;
      const straights = [];
      for (let k = 0; k < run.len; k++) {
        if (tiles[(run.start + k) % n][2] === 'track-straight') straights.push(k);
      }
      if (straights.length < 2) continue;
      for (const i of straights) {
        for (const j of straights) {
          const len = j - i + 1;
          if (len < 6 || len > 18) continue;
          windows.push({ run, i, j, len });
        }
      }
    }
    if (!windows.length) return;
    windows.sort((a, b) => b.len - a.len || a.run.start - b.run.start || a.i - b.i);
    const count = rndInt(rng, 1, 2);
    const cap = Math.max(12, Math.floor(tiles.length * 0.5)); // keep >= half the lap on the ground
    let used = 0;
    let placed = 0;
    for (const w of windows) {
      if (placed >= count) break;
      if (used + w.len > cap) continue;
      const { run, i, j } = w;
      const L = j - i + 1;
      const idxOf = (k) => (run.start + k + n) % n;
      let overlap = false;
      for (let k = i; k <= j; k++) {
        if (removedIdx.has(idxOf(k))) { overlap = true; break; }
      }
      if (overlap) continue;
      const cells = [];
      for (let k = i; k <= j; k++) cells.push(tiles[idxOf(k)]);
      const a = tiles[idxOf(i - 1)];
      const b = tiles[idxOf(j + 1)];
      const gin = dirFromTo(cells[0], a);
      const gout = dirFromTo(cells[L - 1], b);
      if (!gin || !gout) continue;
      elevEntries.push([cells[0][0], cells[0][1], 'slope-up', orientFor([gin], ['S'])]);
      elevEntries.push([cells[L - 1][0], cells[L - 1][1], 'slope-up', orientFor([gout], ['S'])]);
      for (let k = 1; k < L - 1; k++) {
        const c = cells[k];
        const d1 = dirFromTo(c, cells[k - 1]);
        const d2 = dirFromTo(c, cells[k + 1]);
        if (!d1 || !d2) continue;
        if (d1 === OPP_SIDE[d2]) {
          elevEntries.push([c[0], c[1], 'elevated-straight', orientFor([d1, d2], ['N', 'S'])]);
        } else {
          elevEntries.push([c[0], c[1], 'elevated-corner', orientFor([d1, d2], ['S', 'W'])]);
        }
      }
      for (let k = i; k <= j; k++) removedIdx.add(idxOf(k));
      used += L;
      placed++;
    }
  }

  // ─── Elevated bridges ────────────────────────────────────────────────
  // A shortcut that leaves the loop, climbs a ramp and glides OVER the
  // track on elevated pillars, crossing the ground road below through
  // elev-track-cross blocks, then descends back onto the loop. The two
  // attach cells become track-3-way hubs (open toward the ramps), and
  // crossings only happen over perpendicular straights — the exact
  // connections the port grammar allows.
  function genBridges(rng, tiles, order, specialIdx, elevEntries) {
    const groundByKey = new Map();
    for (const i of order) groundByKey.set(key(tiles[i][0], tiles[i][1]), i);
    const elevKeys = new Set(elevEntries.map(([gx, gz]) => key(gx, gz)));
    const candidates = [];
    for (const i of order) {
      const t = tiles[i];
      if (specialIdx.has(i) || t[2] !== 'track-straight') continue;
      if (elevKeys.has(key(t[0], t[1]))) continue;
      candidates.push(i);
    }
    if (candidates.length < 2) return;
    const r = rng();
    const count = r < 0.25 ? 0 : (r < 0.85 ? 1 : 2);
    if (!count) return;
    const usedCells = new Set();
    const specs = [];
    for (let a = 0; a < candidates.length; a++) {
      for (let b = a + 1; b < candidates.length; b++) {
        const P = tiles[candidates[a]];
        const Q = tiles[candidates[b]];
        const axisX = P[1] === Q[1];
        if (!axisX && P[0] !== Q[0]) continue;
        const dist = axisX ? Math.abs(Q[0] - P[0]) : Math.abs(Q[1] - P[1]);
        if (dist < 4 || dist > 16) continue;
        // Hub cells must run perpendicular to the bridge so the road
        // does not point at the ramp cells.
        if (axisX && P[3] !== 0) continue;
        if (axisX && Q[3] !== 0) continue;
        if (!axisX && P[3] !== 22) continue;
        if (!axisX && Q[3] !== 22) continue;
        const lo = axisX ? Math.min(P[0], Q[0]) : Math.min(P[1], Q[1]);
        const interior = [];
        let crossings = 0;
        let ok = true;
        for (let d = 1; d < dist; d++) {
          const cx2 = axisX ? lo + d : P[0];
          const cz2 = axisX ? P[1] : lo + d;
          const k = key(cx2, cz2);
          const gi = groundByKey.get(k);
          if (gi !== undefined) {
            const gt = tiles[gi];
            if (specialIdx.has(gi) || gt[2] !== 'track-straight') { ok = false; break; }
            const roadNS = gt[3] === 0;
            if (axisX !== roadNS) { ok = false; break; }
            interior.push({ x: cx2, z: cz2, cross: true });
            crossings++;
          } else if (elevKeys.has(k)) {
            ok = false; break;
          } else {
            interior.push({ x: cx2, z: cz2, cross: false });
          }
        }
        if (!ok || !interior.length) continue; // 0 crossings = pure elevated shortcut over grass; crossings add road-under-road drama
        if (interior[0].cross || interior[interior.length - 1].cross) continue;
        if (usedCells.has(key(P[0], P[1])) || usedCells.has(key(Q[0], Q[1]))) continue;
        if (interior.some((c) => usedCells.has(key(c.x, c.z)))) continue;
        specs.push({ pi: candidates[a], qi: candidates[b], P, Q, axisX, interior });
      }
    }
    if (!specs.length) return;
    const bridgeOrient = (axisX) => (axisX ? 16 : 0);
    for (let attempt = 0; attempt < count; attempt++) {
      const pool = specs.filter((s) => {
        if (usedCells.has(key(s.P[0], s.P[1])) || usedCells.has(key(s.Q[0], s.Q[1]))) return false;
        return !s.interior.some((c) => usedCells.has(key(c.x, c.z)));
      });
      if (!pool.length) break;
      const spec = pool[Math.floor(rng() * pool.length)];
      const { P, Q, axisX, interior, pi, qi } = spec;
      // P/Q are picked by loop index, so EITHER can be the low end — attach
      // each ramp to the hub that is actually adjacent to it on the axis.
      const loSide = axisX ? (P[0] < Q[0] ? P : Q) : (P[1] < Q[1] ? P : Q);
      const hiSide = loSide === P ? Q : P;
      const loIdx = loSide === P ? pi : qi;
      const hiIdx = loSide === P ? qi : pi;
      const first = interior[0];
      const last = interior[interior.length - 1];
      const dFirst = dirFromTo([first.x, first.z], loSide);
      const dLast = dirFromTo([last.x, last.z], hiSide);
      if (!dFirst || !dLast) continue;
      elevEntries.push([first.x, first.z, 'slope-up', orientFor([dFirst], ['S'])]);
      elevEntries.push([last.x, last.z, 'slope-up', orientFor([dLast], ['S'])]);
      for (let d = 1; d < interior.length - 1; d++) {
        const c = interior[d];
        elevEntries.push([c.x, c.z, c.cross ? 'elevated-cross' : 'elevated-straight', bridgeOrient(axisX)]);
      }
      // interior cells are {x,z} objects while tiles are [gx,gz,...] arrays —
      // dirFromTo reads [0]/[1], so pass array coords explicitly and guard.
      const pSide = dirFromTo(loSide, [first.x, first.z]);
      const qSide = dirFromTo(hiSide, [last.x, last.z]);
      if (!pSide || !qSide) continue;
      const pDirs = axisX ? ['N', 'S', pSide] : ['E', 'W', pSide];
      const qDirs = axisX ? ['N', 'S', qSide] : ['E', 'W', qSide];
      tiles[loIdx][2] = 'track-3-way';
      tiles[loIdx][3] = orientFor(pDirs, ['S', 'E', 'W']);
      tiles[hiIdx][2] = 'track-3-way';
      tiles[hiIdx][3] = orientFor(qDirs, ['S', 'E', 'W']);
      usedCells.add(key(P[0], P[1]));
      usedCells.add(key(Q[0], Q[1]));
      for (const c of interior) usedCells.add(key(c.x, c.z));
    }
  }

  async function generateTrack(seedText) {
    if (!window.__encodeCellsV3) {
      const t0 = Date.now();
      while (!window.__encodeCellsV3 && Date.now() - t0 < 6000) await new Promise((r) => setTimeout(r, 25));
    }
    if (!window.__encodeCellsV3) throw new Error('Cells v3 encoder unavailable (module failed to load)');
    const seed = hash32(seedText);
    const rng = mulberry32(seed);
    let loop = genClosedLoop(rng, {
      W: rndInt(rng, 13, 19), H: rndInt(rng, 13, 19), minLen: rndInt(rng, 20, 30),
      maxLen: rndInt(rng, 34, 56), attempts: 260
    });
    if (!loop) {
      loop = [[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],[8,2],[8,3],[8,4],[8,5],[8,6],[8,7],[7,7],[6,7],[5,7],[4,7],[3,7],[2,7],[2,6],[2,5],[2,4],[2,3],[2,2]];
    }
    const { tiles, cpCandidates } = loopToTiles(loop);
    const cpCount = Math.min(cpCandidates.length, rndInt(rng, 1, 3));
    const cpIdxSet = new Set(sampleDeterministic(cpCandidates, rng, cpCount));
    for (const idx of cpIdxSet) tiles[idx][2] = 'track-checkpoint';
    const specialIdx = new Set([...cpIdxSet]);
    const finishIdx = tiles.findIndex((t) => t[2] === 'track-finish');
    if (finishIdx >= 0) specialIdx.add(finishIdx);
    // ── elevated features (detours + bridges) ──
    const elevEntries = [];
    const removedIdx = new Set();
    genDetours(rng, tiles, specialIdx, removedIdx, elevEntries);
    const order = tiles.map((_, i) => i).filter((i) => !removedIdx.has(i));
    genBridges(rng, tiles, order, specialIdx, elevEntries);
    const groundTiles = order.map((i) => tiles[i]);
    // ── extras: bumps + surfaces on plain ground cells only ──
    const elevKeys = new Set(elevEntries.map(([gx, gz]) => key(gx, gz)));
    const bumpCandidates = groundTiles.filter(([gx, gz, t]) => t === 'track-straight' && !elevKeys.has(key(gx, gz)));
    const bumps = sampleDeterministic(bumpCandidates, rng, Math.min(5, Math.max(1, Math.floor(tiles.length / 11))));
    const surfCandidates = groundTiles.filter(([gx, gz, t]) => (t === 'track-straight' || t === 'track-corner') && !elevKeys.has(key(gx, gz)));
    const surfacePalette = ['surface-wood', 'surface-ice', 'surface-boost'];
    const surfaceCells = sampleDeterministic(surfCandidates, rng, Math.min(7, Math.max(2, Math.floor(tiles.length / 7))))
      .map(([x, z, t], idx) => [x, z, t === 'track-corner' ? 'surface-ice' : surfacePalette[idx % surfacePalette.length]]);
    const modsObj = { b: bumps, s: [], u: surfaceCells, d: [], e: elevEntries };
    const map = await window.__encodeCellsV3(groundTiles);
    const modsEncoded = encodeMods(modsObj);
    const playUrl = `${BASE_URL}?map=${encodeURIComponent(map)}&mods=${encodeURIComponent(modsEncoded)}`;
    return { map, mods: modsEncoded, playUrl, cells: groundTiles, modsObj };
  }
const WEATHER_PRESETS = {
  clear: { sky: 0xbfd8ff, ambient: 0xffffff },
  sunset: { sky: 0xffb37b, ambient: 0xffe0c7 },
  night: { sky: 0x0d1220, ambient: 0x9fb6ff },
  'night-constellations': { sky: 0x0d1220, ambient: 0x9fb6ff },
  overcast: { sky: 0x9ca9b8, ambient: 0xd7dde8 },
};
const WEATHER_DEFAULT = 'clear';
const PRECIP_DEFAULT = 'none';
const INTENSITY_DEFAULT = 'medium';
const WIND_DEFAULT = 'none';
const PRECIP_TYPES = new Set(['none', 'rain', 'snow']);
const INTENSITY_TYPES = new Set(['low', 'medium', 'high']);
const WIND_TYPES = new Set(['none', 'breezy', 'gusty']);

function normalizeWeatherPreset(preset) {
  return WEATHER_PRESETS[preset] ? preset : WEATHER_DEFAULT;
}

function normalizeWeatherDetails(value) {
  const next = value || {};
  return {
    preset: normalizeWeatherPreset(next.preset),
    precipitation: PRECIP_TYPES.has(next.precipitation) ? next.precipitation : PRECIP_DEFAULT,
    intensity: INTENSITY_TYPES.has(next.intensity) ? next.intensity : INTENSITY_DEFAULT,
    lightning: Boolean(next.lightning),
    wind: WIND_TYPES.has(next.wind) ? next.wind : WIND_DEFAULT,
  };
}

function decodeExtrasParam(str) {
  if (!str) return null;
  try {
    const json = decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
    const parsed = JSON.parse(json);
	    return {
	      bumps: Array.isArray(parsed.b) ? parsed.b : [],
	      poles: Array.isArray(parsed.p) ? parsed.p : [],
	      cubes: Array.isArray(parsed.k) ? parsed.k : [],
	      walls: Array.isArray(parsed.l) ? parsed.l : [],
	      boosts: Array.isArray(parsed.s) ? parsed.s : [],
	      elevated: Array.isArray(parsed.e) ? parsed.e : [],
	      jumps: Array.isArray(parsed.j) ? parsed.j : [],
      decorations: Array.isArray(parsed.d) ? parsed.d : [],
      surfaces: Array.isArray(parsed.u) ? parsed.u : [],
      customSurfaces: parsed?.c && typeof parsed.c === 'object' ? parsed.c : {},
      customPads: parsed?.y && typeof parsed.y === 'object' ? parsed.y : {},
      customAssets: parsed?.x && typeof parsed.x === 'object' ? parsed.x : {},
      weather: normalizeWeatherDetails(parsed?.w),
    };
  } catch {
    return null;
  }
}

function normalizeTrackPath(pathValue) {
  const raw = String(pathValue || '/');
  if (raw === '/index.html') return '/';
  if (raw.endsWith('/index.html')) return `${raw.slice(0, -11)}/`;
  return raw;
}

function hashTrackSeed(value) {
  const hashA = fnv64Hex(value, 0xcbf29ce484222325n, 0x100000001b3n);
  const hashB = fnv64Hex(value, 0x84222325cbf29cen, 0x100000001c3n);
  return `${hashA}${hashB}`;
}

function fnv64Hex(value, start, prime) {
  let hash = start;
  for (let i = 0; i < value.length; i++) {
    hash ^= BigInt(value.charCodeAt(i));
    hash = (hash * prime) & 0xffffffffffffffffn;
  }
  return hash.toString(16).padStart(16, '0');
}

function buildTrackId(pathname, mapParam, modsParam) {
  const query = new URLSearchParams();
  if (mapParam) query.set('map', mapParam);
  if (modsParam) query.set('mods', modsParam);
  const rawUrl = `${pathname}${query.toString() ? `?${query.toString()}` : ''}`;
  // Default track (no map/mods) keeps the reset v5 id; others keep v4.
  const seedVersion = (mapParam || modsParam) ? 'v4' : 'v5';
  return `trk-${hashTrackSeed(`${seedVersion}-url|${rawUrl}`)}`;
}

function getTrackIds(playUrl) {
  try {
    const parsed = new URL(playUrl, window.location.href);
    const map = parsed.searchParams.get('map');
    const mods = parsed.searchParams.get('mods');
    const rawPath = parsed.pathname || '/';
    const normalizedPath = normalizeTrackPath(rawPath);
    return [buildTrackId(normalizedPath, map, mods)];
  } catch {
    return [];
  }
}
  // ── Realistic 3D top-down previews ──
  // Renders ONE frozen bird's-eye snapshot of each cup track with the real
  // block models (js/TrackTopDownRenderer.js, loaded via the importmap
  // module in <head>) — queued one at a time through a single shared WebGL
  // context, cached in a localStorage LRU so each track renders at most
  // once per browser. The flat 2D grid stays underneath as the fallback.


  function paintPreviewImageOnCanvas( canvas, dataUrl ) {
    return new Promise( ( resolve ) => {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext( '2d' );
        ctx.clearRect( 0, 0, canvas.width, canvas.height );
        ctx.drawImage( img, 0, 0, canvas.width, canvas.height );
        resolve( true );
      };
      img.onerror = () => resolve( false );
      img.src = dataUrl;
    } );
  }

  async function waitForPreview3dModule( timeoutMs = 8000 ) {
    const start = Date.now();
    while ( ! window.__renderTrackTopDown && Date.now() - start < timeoutMs ) {
      await new Promise( ( r ) => setTimeout( r, 50 ) );
    }
    return !! window.__renderTrackTopDown;
  }

  async function upgradePreview3D( canvas, cells, mods, cacheKey ) {
    try {
      if ( ! Array.isArray( cells ) || ! cells.length || ! cacheKey ) return;
      await waitForPreview3dModule();
      if ( ! window.__renderTrackTopDown ) return;
      // Hi-res render downscaled onto the canvas so the wide card preview
      // stays crisp (matches the page's 1.2 display aspect).
      const dataUrl = await window.__renderTrackTopDown( cells, mods, { cacheKey: cacheKey, width: 600, height: 500 } );
      if ( dataUrl ) await paintPreviewImageOnCanvas( canvas, dataUrl );
    } catch ( e ) {}
  }

  function drawPreview(canvas, cells, mods) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const xs = cells.map((c) => c[0]);
    const zs = cells.map((c) => c[1]);
    const minX = Math.min(...xs) - 1, maxX = Math.max(...xs) + 1;
    const minZ = Math.min(...zs) - 1, maxZ = Math.max(...zs) + 1;
    const gw = maxX - minX + 1;
    const gh = maxZ - minZ + 1;
    const pad = 8;
    const size = Math.max(4, Math.floor(Math.min((canvas.width - pad * 2) / gw, (canvas.height - pad * 2) / gh)));
    const toPix = (x, z) => [pad + (x - minX) * size, pad + (z - minZ) * size];
    for (const [x, z, t] of cells) {
      const [px, py] = toPix(x, z);
      ctx.fillStyle = t === 'track-finish' ? '#72e39a' : t === 'track-checkpoint' ? '#ffd54f' : t === 'track-corner' ? '#b084ff' : '#4da3ff';
      ctx.fillRect(px + 1, py + 1, size - 2, size - 2);
    }
    ctx.strokeStyle = '#ff4d4d';
    for (const [x, z] of (mods.b || [])) {
      const [px, py] = toPix(x, z);
      ctx.beginPath();
      ctx.arc(px + size / 2, py + size / 2, Math.max(2, size * 0.22), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function utcTodayStr() {
    const d = new Date();
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function getWeekStartUtc(dateText) {
    const source = dateText ? new Date(`${dateText}T00:00:00Z`) : new Date();
    const utcDay = source.getUTCDay(); // Sun=0
    const mondayOffset = (utcDay + 6) % 7;
    source.setUTCDate(source.getUTCDate() - mondayOffset);
    const y = source.getUTCFullYear();
    const m = String(source.getUTCMonth() + 1).padStart(2, '0');
    const d = String(source.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatSeconds(v) { return Number.isFinite(v) ? `${v.toFixed(2)}s` : '--.--'; }

  async function fetchTopRow(playUrl) {
    const ids = getTrackIds(playUrl);
    const payloads = await Promise.all(ids.map(async (id) => {
      try {
        const res = await fetch(`${LEADERBOARD_API_BASE}?trackId=${encodeURIComponent(id)}`);
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }));
    const rows = payloads.flatMap((payload) => Array.isArray(payload?.entries) ? payload.entries : []);
    if (!rows.length) return null;
    return rows.slice().sort((a, b) => Number(a?.timeSeconds) - Number(b?.timeSeconds))[0] || null;
  }

  async function renderCup() {
    const selectedDate = document.getElementById('dateInput').value || utcTodayStr();
    const weekStart = getWeekStartUtc(selectedDate);
    const gridEl = document.getElementById('cupGrid');
    const leaderRows = document.getElementById('leaderRows');
    document.getElementById('cupTitle').textContent = `Weekly Cup • Week of ${weekStart}`;
    document.getElementById('seedLine').textContent = `Seed: weekly-cup:${weekStart}`;
    gridEl.innerHTML = '';
    leaderRows.innerHTML = '<tr><td colspan="3">Loading leaderboard data…</td></tr>';

    const tracks = [];
    for (let i = 0; i < 9; i++) tracks.push(await generateTrack(`weekly-cup:${weekStart}:slot:${i + 1}`));

    tracks.forEach((track, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>Track ${idx + 1}</h3><canvas width="280" height="210"></canvas><div class="row"><span class="meta">Seed slot ${idx + 1}</span><a class="linkbtn" href="${track.playUrl}" target="_blank" rel="noopener">Play</a></div>`;
      const canvas = card.querySelector('canvas');
      drawPreview(canvas, track.cells, track.modsObj);
      upgradePreview3D(canvas, track.cells, track.modsObj, track.playUrl);
      gridEl.appendChild(card);
    });

    const topRows = await Promise.all(tracks.map((track) => fetchTopRow(track.playUrl)));
    leaderRows.innerHTML = '';
    const wins = new Map();
    topRows.forEach((row, idx) => {
      const holder = String(row?.name || 'No record yet');
      if (row?.name) wins.set(holder, (wins.get(holder) || 0) + 1);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><a href="${tracks[idx].playUrl}" target="_blank" rel="noopener">Track ${idx + 1}</a></td><td>${holder}</td><td>${formatSeconds(Number(row?.timeSeconds))}</td>`;
      leaderRows.appendChild(tr);
    });

    const leaders = [...wins.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    document.getElementById('champName').textContent = leaders.length ? leaders[0][0] : 'No records yet';
    document.getElementById('champCount').textContent = leaders.length ? `${leaders[0][1]} weekly cup record${leaders[0][1] === 1 ? '' : 's'} held` : 'Complete a lap to claim first.';
  }

  const dateInput = document.getElementById('dateInput');
  dateInput.value = utcTodayStr();
  document.getElementById('regenBtn').addEventListener('click', () => { renderCup(); });
  renderCup();
})();
</script>
