<script type="module">
	// Realistic 3D top-down track preview. The module exposes
	// window.__renderTrackTopDown; the page falls back to its flat 2D
	// grid if the module or WebGL is unavailable.
	import { renderTrackTopDown } from './js/TrackTopDownRenderer.js?v=20260928';
	import { encodeCellsV3 } from './js/Track.js?v=1000238';
	import { generateTrackPlan } from './js/CupTrackGen.js?v=20260918';
	window.__renderTrackTopDown = renderTrackTopDown;
	window.__encodeCellsV3 = encodeCellsV3;
	window.__cupTrackGen = generateTrackPlan;

<script>
(() => {
  const BASE_URL = 'https://everybodysim.github.io/Racing-game/index.html';
  const LEADERBOARD_API_BASE = 'https://racing-leaderboard-api.ga1010.workers.dev/api/leaderboard';

  function encodeMods(modsObj) {
    const json = JSON.stringify(modsObj);
    return btoa(json).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // Track generation lives in js/CupTrackGen.js (shared with totd.html): a
  // fixed loop walk, checkpoints, bumps and surfaces, and elevated detours
  // whose elevated road is SEARCHED — it can cut across the map and cross
  // OVER the ground loop using elevated-cross / elevated-cross-corner blocks.
  // Ramps attach in-line, so no 3-way/4-way cells are ever generated.
  async function generateTrack(seedText) {
    const t0 = Date.now();
    while ((!window.__cupTrackGen || !window.__encodeCellsV3) && Date.now() - t0 < 6000) {
      await new Promise((r) => setTimeout(r, 25));
    }
    if (!window.__cupTrackGen || !window.__encodeCellsV3) throw new Error('Track generator unavailable');
    const plan = window.__cupTrackGen(seedText);
    const map = await window.__encodeCellsV3(plan.cells);
    const modsEncoded = encodeMods(plan.modsObj);
    const playUrl = `${BASE_URL}?map=${encodeURIComponent(map)}&mods=${encodeURIComponent(modsEncoded)}`;
    return { map, mods: modsEncoded, playUrl, cells: plan.cells, modsObj: plan.modsObj };
  }

const WEATHER_PRESETS = {
  clear: { sky: 0xbfd8ff, ambient: 0xffffff },
  sunset: { sky: 0xffb37b, ambient: 0xffe0c7 },
  night: { sky: 0x0d1220, ambient: 0x9fb6ff },
  'night-constellations': { sky: 0x0d1220, ambient: 0x9fb6ff },
  overcast: { sky: 0x9ca9b8, ambient: 0xd7dde8 },
};
const WEATHER_DEFAULT = 'clear';
const PRECIP_DEFAULT = 'none';
const INTENSITY_DEFAULT = 'medium';
const WIND_DEFAULT = 'none';
const PRECIP_TYPES = new Set(['none', 'rain', 'snow']);
const INTENSITY_TYPES = new Set(['low', 'medium', 'high']);
const WIND_TYPES = new Set(['none', 'breezy', 'gusty']);

function normalizeWeatherPreset(preset) {
  return WEATHER_PRESETS[preset] ? preset : WEATHER_DEFAULT;
}

function normalizeWeatherDetails(value) {
  const next = value || {};
  return {
    preset: normalizeWeatherPreset(next.preset),
    precipitation: PRECIP_TYPES.has(next.precipitation) ? next.precipitation : PRECIP_DEFAULT,
    intensity: INTENSITY_TYPES.has(next.intensity) ? next.intensity : INTENSITY_DEFAULT,
    lightning: Boolean(next.lightning),
    wind: WIND_TYPES.has(next.wind) ? next.wind : WIND_DEFAULT,
  };
}

function decodeExtrasParam(str) {
  if (!str) return null;
  try {
    const json = decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
    const parsed = JSON.parse(json);
	    return {
	      bumps: Array.isArray(parsed.b) ? parsed.b : [],
	      poles: Array.isArray(parsed.p) ? parsed.p : [],
	      cubes: Array.isArray(parsed.k) ? parsed.k : [],
	      walls: Array.isArray(parsed.l) ? parsed.l : [],
	      boosts: Array.isArray(parsed.s) ? parsed.s : [],
	      elevated: Array.isArray(parsed.e) ? parsed.e : [],
	      jumps: Array.isArray(parsed.j) ? parsed.j : [],
      decorations: Array.isArray(parsed.d) ? parsed.d : [],
      surfaces: Array.isArray(parsed.u) ? parsed.u : [],
      customSurfaces: parsed?.c && typeof parsed.c === 'object' ? parsed.c : {},
      customPads: parsed?.y && typeof parsed.y === 'object' ? parsed.y : {},
      customAssets: parsed?.x && typeof parsed.x === 'object' ? parsed.x : {},
      weather: normalizeWeatherDetails(parsed?.w),
    };
  } catch {
    return null;
  }
}

function normalizeTrackPath(pathValue) {
  const raw = String(pathValue || '/');
  if (raw === '/index.html') return '/';
  if (raw.endsWith('/index.html')) return `${raw.slice(0, -11)}/`;
  return raw;
}

function hashTrackSeed(value) {
  const hashA = fnv64Hex(value, 0xcbf29ce484222325n, 0x100000001b3n);
  const hashB = fnv64Hex(value, 0x84222325cbf29cen, 0x100000001c3n);
  return `${hashA}${hashB}`;
}

function fnv64Hex(value, start, prime) {
  let hash = start;
  for (let i = 0; i < value.length; i++) {
    hash ^= BigInt(value.charCodeAt(i));
    hash = (hash * prime) & 0xffffffffffffffffn;
  }
  return hash.toString(16).padStart(16, '0');
}

function buildTrackId(pathname, mapParam, modsParam) {
  const query = new URLSearchParams();
  if (mapParam) query.set('map', mapParam);
  if (modsParam) query.set('mods', modsParam);
  const rawUrl = `${pathname}${query.toString() ? `?${query.toString()}` : ''}`;
  // Default track (no map/mods) keeps the reset v5 id; others keep v4.
  const seedVersion = (mapParam || modsParam) ? 'v4' : 'v5';
  return `trk-${hashTrackSeed(`${seedVersion}-url|${rawUrl}`)}`;
}

function getTrackIds(playUrl) {
  try {
    const parsed = new URL(playUrl, window.location.href);
    const map = parsed.searchParams.get('map');
    const mods = parsed.searchParams.get('mods');
    const rawPath = parsed.pathname || '/';
    const normalizedPath = normalizeTrackPath(rawPath);
    return [buildTrackId(normalizedPath, map, mods)];
  } catch {
    return [];
  }
}
  // ── Realistic 3D top-down previews ──
  // Renders ONE frozen bird's-eye snapshot of each cup track with the real
  // block models (js/TrackTopDownRenderer.js, loaded via the importmap
  // module in <head>) — queued one at a time through a single shared WebGL
  // context, cached in a localStorage LRU so each track renders at most
  // once per browser. The flat 2D grid stays underneath as the fallback.


  function paintPreviewImageOnCanvas( canvas, dataUrl ) {
    return new Promise( ( resolve ) => {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext( '2d' );
        ctx.clearRect( 0, 0, canvas.width, canvas.height );
        ctx.drawImage( img, 0, 0, canvas.width, canvas.height );
        resolve( true );
      };
      img.onerror = () => resolve( false );
      img.src = dataUrl;
    } );
  }

  async function waitForPreview3dModule( timeoutMs = 8000 ) {
    const start = Date.now();
    while ( ! window.__renderTrackTopDown && Date.now() - start < timeoutMs ) {
      await new Promise( ( r ) => setTimeout( r, 50 ) );
    }
    return !! window.__renderTrackTopDown;
  }

  async function upgradePreview3D( canvas, cells, mods, cacheKey ) {
    try {
      if ( ! Array.isArray( cells ) || ! cells.length || ! cacheKey ) return;
      await waitForPreview3dModule();
      if ( ! window.__renderTrackTopDown ) return;
      // Hi-res render downscaled onto the canvas so the wide card preview
      // stays crisp (matches the page's 1.2 display aspect).
      const dataUrl = await window.__renderTrackTopDown( cells, mods, { cacheKey: cacheKey, width: 600, height: 500 } );
      if ( dataUrl ) await paintPreviewImageOnCanvas( canvas, dataUrl );
    } catch ( e ) {}
  }

  function drawPreview(canvas, cells, mods) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const xs = cells.map((c) => c[0]);
    const zs = cells.map((c) => c[1]);
    const minX = Math.min(...xs) - 1, maxX = Math.max(...xs) + 1;
    const minZ = Math.min(...zs) - 1, maxZ = Math.max(...zs) + 1;
    const gw = maxX - minX + 1;
    const gh = maxZ - minZ + 1;
    const pad = 8;
    const size = Math.max(4, Math.floor(Math.min((canvas.width - pad * 2) / gw, (canvas.height - pad * 2) / gh)));
    const toPix = (x, z) => [pad + (x - minX) * size, pad + (z - minZ) * size];
    for (const [x, z, t] of cells) {
      const [px, py] = toPix(x, z);
      ctx.fillStyle = t === 'track-finish' ? '#72e39a' : (t === 'track-checkpoint' || t === 'track-checkpoint-corner') ? '#ffd54f' : t === 'track-corner' ? '#b084ff' : '#4da3ff';
      ctx.fillRect(px + 1, py + 1, size - 2, size - 2);
    }
    ctx.strokeStyle = '#ff4d4d';
    for (const [x, z] of (mods.b || [])) {
      const [px, py] = toPix(x, z);
      ctx.beginPath();
      ctx.arc(px + size / 2, py + size / 2, Math.max(2, size * 0.22), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function utcTodayStr() {
    const d = new Date();
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function getWeekStartUtc(dateText) {
    const source = dateText ? new Date(`${dateText}T00:00:00Z`) : new Date();
    const utcDay = source.getUTCDay(); // Sun=0
    const mondayOffset = (utcDay + 6) % 7;
    source.setUTCDate(source.getUTCDate() - mondayOffset);
    const y = source.getUTCFullYear();
    const m = String(source.getUTCMonth() + 1).padStart(2, '0');
    const d = String(source.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatSeconds(v) { return Number.isFinite(v) ? `${v.toFixed(2)}s` : '--.--'; }

  async function fetchTopRow(playUrl) {
    const ids = getTrackIds(playUrl);
    const payloads = await Promise.all(ids.map(async (id) => {
      try {
        const res = await fetch(`${LEADERBOARD_API_BASE}?trackId=${encodeURIComponent(id)}`);
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }));
    const rows = payloads.flatMap((payload) => Array.isArray(payload?.entries) ? payload.entries : []);
    if (!rows.length) return null;
    return rows.slice().sort((a, b) => Number(a?.timeSeconds) - Number(b?.timeSeconds))[0] || null;
  }

  async function renderCup() {
    const selectedDate = document.getElementById('dateInput').value || utcTodayStr();
    const weekStart = getWeekStartUtc(selectedDate);
    const gridEl = document.getElementById('cupGrid');
    const leaderRows = document.getElementById('leaderRows');
    document.getElementById('cupTitle').textContent = `Weekly Cup • Week of ${weekStart}`;
    document.getElementById('seedLine').textContent = `Seed: weekly-cup:${weekStart}`;
    gridEl.innerHTML = '';
    leaderRows.innerHTML = '<tr><td colspan="3">Loading leaderboard data…</td></tr>';

    const tracks = [];
    for (let i = 0; i < 9; i++) tracks.push(await generateTrack(`weekly-cup:${weekStart}:slot:${i + 1}`));

    tracks.forEach((track, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>Track ${idx + 1}</h3><canvas width="280" height="210"></canvas><div class="row"><span class="meta">Seed slot ${idx + 1}</span><a class="linkbtn" href="${track.playUrl}" target="_blank" rel="noopener">Play</a></div>`;
      const canvas = card.querySelector('canvas');
      drawPreview(canvas, track.cells, track.modsObj);
      upgradePreview3D(canvas, track.cells, track.modsObj, track.playUrl);
      gridEl.appendChild(card);
    });

    const topRows = await Promise.all(tracks.map((track) => fetchTopRow(track.playUrl)));
    leaderRows.innerHTML = '';
    const wins = new Map();
    topRows.forEach((row, idx) => {
      const holder = String(row?.name || 'No record yet');
      if (row?.name) wins.set(holder, (wins.get(holder) || 0) + 1);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><a href="${tracks[idx].playUrl}" target="_blank" rel="noopener">Track ${idx + 1}</a></td><td>${holder}</td><td>${formatSeconds(Number(row?.timeSeconds))}</td>`;
      leaderRows.appendChild(tr);
    });

    const leaders = [...wins.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    document.getElementById('champName').textContent = leaders.length ? leaders[0][0] : 'No records yet';
    document.getElementById('champCount').textContent = leaders.length ? `${leaders[0][1]} weekly cup record${leaders[0][1] === 1 ? '' : 's'} held` : 'Complete a lap to claim first.';
  }

  const dateInput = document.getElementById('dateInput');
  dateInput.value = utcTodayStr();
  document.getElementById('regenBtn').addEventListener('click', () => { renderCup(); });
  renderCup();
})();
</script>
